<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navi|Ninja World</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #FFD700;
      --orange: #FF6B00;
      --blue-dark: #0a0e2a;
      --blue-mid: #111a3e;
      --blue-neon: #1e90ff;
      --purple: #6a0dad;
      --star-yellow: #ffe14d;
      --shadow-glow: 0 0 24px rgba(255,165,0,0.7), 0 0 60px rgba(30,144,255,0.3);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--blue-dark);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Animated starfield background ── */
    .bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(106,13,173,0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(30,144,255,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(255,107,0,0.2)  0%, transparent 45%),
        linear-gradient(160deg, #0a0e2a 0%, #111a3e 60%, #0d1530 100%);
    }

    /* Hex grid overlay */
    .bg-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(60deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(120deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 40px);
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: floatOrb 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 400px; height: 400px; background: #6a0dad; top: -100px; left: -100px; animation-duration: 14s; }
    .orb-2 { width: 350px; height: 350px; background: #1e90ff; bottom: -80px; right: -80px; animation-duration: 10s; }
    .orb-3 { width: 250px; height: 250px; background: #FF6B00; top: 40%; left: 30%; animation-duration: 16s; }
    @keyframes floatOrb { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,40px) scale(1.1); } }

    /* Stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.1; transform: scale(0.8); } to { opacity: 0.9; transform: scale(1.2); } }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    /* ── Header banner ── */
    .banner {
      background: linear-gradient(135deg, rgba(255,107,0,0.15) 0%, rgba(30,144,255,0.15) 100%);
      border: 2px solid rgba(255,215,0,0.35);
      border-radius: 24px;
      padding: 36px 40px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-glow);
      margin-bottom: 48px;
    }
    .banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 18px,
        rgba(255,215,0,0.03) 18px,
        rgba(255,215,0,0.03) 19px
      );
    }

    .site-title {
      font-family: 'Bangers', cursive;
      font-size: clamp(2.4rem, 7vw, 5rem);
      letter-spacing: 3px;
      line-height: 1.05;
      background: linear-gradient(135deg, #FFD700 0%, #FF6B00 40%, #fff 70%, #FFD700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 18px rgba(255,165,0,0.8));
      animation: pulseTitle 4s ease-in-out infinite alternate;
    }
    @keyframes pulseTitle { from { filter: drop-shadow(0 0 10px rgba(255,165,0,0.6)); } to { filter: drop-shadow(0 0 28px rgba(255,165,0,1)) drop-shadow(0 0 50px rgba(30,144,255,0.4)); } }

    .pipe { -webkit-text-fill-color: rgba(255,255,255,0.5); }

    .subtitle {
      margin-top: 18px;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      font-weight: 700;
      color: rgba(255,255,255,0.88);
      line-height: 1.55;
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
    }
    .heart-emoji {
      display: inline-block;
      animation: heartbeat 1.2s ease-in-out infinite;
      font-size: 1.3em;
    }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      20% { transform: scale(1.35); }
      40% { transform: scale(1); }
      60% { transform: scale(1.2); }
    }

    /* ── Main grid ── */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto;
      gap: 32px;
      align-items: center;
      justify-items: center;
    }

    /* ── Social card (TikTok / YouTube) ── */
    .social-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-link {
      display: block;
      position: relative;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    }
    .logo-link:hover { transform: scale(1.12) rotate(-3deg); }
    .logo-link:hover .logo-ring { box-shadow: 0 0 0 4px var(--gold), 0 0 30px rgba(255,215,0,0.6); }

    .logo-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 2px rgba(255,215,0,0.3), 0 8px 32px rgba(0,0,0,0.5);
      transition: box-shadow 0.3s;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Placeholder logo image — replace src with real logo URL */
    .logo-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* Fallback icon shown when no image */
    .logo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
    }

    .logo-caption {
      font-family: 'Bangers', cursive;
      font-size: 1.05rem;
      letter-spacing: 1.5px;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(255,215,0,0.6);
      text-align: center;
      animation: captionPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes captionPulse { from { opacity: 0.7; } to { opacity: 1; } }

    /* ── Brawl Stars character ── */
    .character-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .character-frame {
      width: clamp(180px, 25vw, 280px);
      aspect-ratio: 3/4;
      border-radius: 20px;
      overflow: hidden;
      border: 3px solid rgba(255,215,0,0.5);
      box-shadow: 0 0 40px rgba(255,107,0,0.4), 0 0 80px rgba(30,144,255,0.2), 0 12px 40px rgba(0,0,0,0.6);
      background: linear-gradient(160deg, rgba(30,144,255,0.1) 0%, rgba(106,13,173,0.2) 100%);
      position: relative;
      animation: floatChar 3.5s ease-in-out infinite alternate;
    }
    @keyframes floatChar { from { transform: translateY(0px); } to { transform: translateY(-12px); } }

    /* Replace src with your Brawl Stars character PNG URL */
    .character-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .char-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      background: linear-gradient(160deg, rgba(30,144,255,0.15), rgba(106,13,173,0.25));
      color: rgba(255,255,255,0.3);
      flex-direction: column;
      gap: 8px;
    }
    .char-placeholder span { font-size: 0.85rem; font-family: 'Nunito', sans-serif; font-weight: 700; letter-spacing: 1px; }

    /* Glow ring beneath character */
    .character-glow {
      width: 60%;
      height: 20px;
      background: radial-gradient(ellipse, rgba(255,165,0,0.5) 0%, transparent 70%);
      border-radius: 50%;
      margin-top: -10px;
      filter: blur(6px);
    }

    /* ── Decorative stars / gems ── */
    .gem {
      position: absolute;
      font-size: 1.2rem;
      animation: gemFloat var(--dur,4s) ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 2;
    }
    @keyframes gemFloat { from { transform: translateY(0) rotate(0deg); opacity: 0.8; } to { transform: translateY(-14px) rotate(20deg); opacity: 1; } }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .main-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }
      .character-wrap {
        grid-column: 1 / -1;
        grid-row: 1;
        order: -1;
      }
      .logo-ring { width: 88px; height: 88px; }
    }

    @media (max-width: 420px) {
      .banner { padding: 24px 18px 20px; border-radius: 16px; }
      .main-grid { gap: 20px; }
    }

    /* ── Footer ── */
    .footer {
      margin-top: 52px;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-canvas"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="stars" id="stars"></div>

  <div class="page">

    <!-- ── Header Banner ── -->
    <div class="banner">
      <h1 class="site-title">Добро пожаловать в Navi<span class="pipe">|</span>Ninja World.</h1>
      <p class="subtitle">
        Я Navi|Ninja — рад тебя видеть у себя!<br>
        Надеюсь тебе здесь понравится!&nbsp;<span class="heart-emoji">💜</span>
      </p>
    </div>

    <!-- ── Main Content Grid ── -->
    <div class="main-grid">

      <!-- LEFT — TikTok -->
      <div class="social-card">
        <!--
          TikTok logo:
          Replace href with your TikTok channel URL.
          Replace the <div class="logo-placeholder"> with:
            <img src="YOUR_TIKTOK_LOGO_URL" alt="TikTok" />
          inside .logo-ring to display the real logo.
        -->
        <a class="logo-link" href="https://www.tiktok.com/@navininja52" target="_blank" rel="noopener" title="TikTok">
          <div class="logo-ring">
            <!-- ↓ Replace with: <img src="YOUR_TIKTOK_LOGO.png" alt="TikTok"> -->
            <img src="https://cdn.inspireuplift.com/uploads/images/seller_products/1680533956_tic-19.png.png" alt="TikTok">
          </div>
        </a>
        <span class="logo-caption">Нажми на логотип</span>
      </div>

      <!-- CENTER — Brawl Stars Character -->
      <div class="character-wrap">
        <!-- Decorative gems -->
        <span class="gem" style="top:-18px;left:-10px;--dur:3.8s;">💎</span>
        <span class="gem" style="top:10px;right:-14px;--dur:4.5s;">⭐</span>
        <span class="gem" style="bottom:30px;left:-16px;--dur:3.2s;">💥</span>

        <div class="character-frame">
          <!--
            Replace the <div class="char-placeholder"> block with:
              <img src="YOUR_CHARACTER_IMAGE_URL.png" alt="Brawl Stars Character">
            to display your character.
          -->
          <img src="https://static.wikia.nocookie.net/brawlstars/images/9/90/%D0%A1%D0%BA%D0%B2%D0%B8%D0%B4%D0%B2%D0%BE%D1%80%D1%82%D0%B8%D1%81%D0%9F%D0%BE%D0%B1%D0%B5%D0%B4%D0%B0.gif/revision/latest?cb=20240922014006&path-prefix=ru.gif" alt="Brawl Stars Character">
        </div>
        <div class="character-glow"></div>
      </div>

      <!-- RIGHT — YouTube -->
      <div class="social-card">
        <!--
          YouTube logo:
          Replace href with your YouTube channel URL.
          Replace the <div class="logo-placeholder"> with:
            <img src="YOUR_YOUTUBE_LOGO_URL" alt="YouTube" />
          inside .logo-ring to display the real logo.
        -->
        <a class="logo-link" href="https://www.youtube.com/@Navi-Ninja" target="_blank" rel="noopener" title="YouTube">
          <div class="logo-ring">
            <!-- ↓ Replace with: <img src="YOUR_YOUTUBE_LOGO.png" alt="YouTube"> -->
            <img src="https://static.vecteezy.com/system/resources/previews/018/930/575/large_2x/youtube-logo-youtube-icon-transparent-free-png.png.png" alt="YouTube">
          </div>
        </a>
        <span class="logo-caption">Нажми на логотип</span>
      </div>

    </div>

    <footer class="footer">© Navi|Ninja World · Brawl Stars Fan Page</footer>
  </div>

  <script>
    // Generate random twinkling stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}%;
        left:${Math.random()*100}%;
        --dur:${(Math.random()*3+1.5).toFixed(1)}s;
        animation-delay:${(Math.random()*4).toFixed(1)}s;
      `;
      starsEl.appendChild(s);
    }
  </script>
</body>
</html>
